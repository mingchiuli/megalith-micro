<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.ico" />
    <!--
      Resolve the theme before the first paint so dark-mode visitors never see a light frame.
      Keep in sync with themeStore.initTheme().
    -->
    <script>
      ;(function () {
        try {
          var stored = document.cookie.match(/(?:^|;\s*)megalith_theme=(dark|light)(?:;|$)/)
          var dark = stored
            ? stored[1] === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (ignored) {
          // Theme resolution must never block rendering.
        }
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!--app-state-->
    <!--app-body-tags-->
    <!--app-teleports-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
