spring:
  application:
    name: micro-blog
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          auto: update
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
    time-zone: GMT+8
server:
  port: 8082
  max-http-request-header-size: 10MB

megalith:
  outbox:
    producer: BLOG
    exchange: blog.change.fanout.exchange
  task-lock:
    environment: ${spring.profiles.active:default}
  blog:
    maintenance:
      read-only: false
    statistics-sync:
      enabled: true
      interval: 60s
      batch-size: 500
    oss:
      base-url: https://${megalith.blog.aliyun.oss.bucket-name}.${megalith.blog.oss.endpoint}
      endpoint: oss-cn-hangzhou.aliyuncs.com
