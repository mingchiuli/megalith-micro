spring:
  data:
    redis:
      port: 6379
      password: 123456
      host: 127.0.0.1
  rabbitmq:
    username: guest
    password: guest
    host: 127.0.0.1
    port: 5672

megalith:
  blog:
    blog-url: http://127.0.0.1:8082/inner

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:5080/api/default/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:5080/api/default/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:5080/api/default/v1/logs
