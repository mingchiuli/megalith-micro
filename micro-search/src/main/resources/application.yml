spring:
  application:
    name: micro-search
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
    time-zone: GMT+8
server:
  port: 8085
  max-http-request-header-size: 10MB

megalith:
  task-lock:
    environment: ${spring.profiles.active:default}
  search:
    maintenance:
      enabled: false
    index:
      alias: blog_search
      legacy-name: blog_index_v4
      rebuild-batch-size: 500
  blog:
    blog-page-size: 5
