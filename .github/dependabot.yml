# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust (Cargo)：仅根目录覆盖整个 workspace
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "Asia/Shanghai"

  # Gradle：仅根目录覆盖所有子项目（版本定义在根目录）
  - package-ecosystem: "gradle"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "Asia/Shanghai"

  # Bun：根目录管理整个 JavaScript workspace 和唯一锁文件
  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "09:40"
      timezone: "Asia/Shanghai"

  # GitHub Actions：自动升级 workflow 中 uses 的版本引用
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "09:50"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker：升级 Dockerfile 中带语义化 tag 的基础镜像
  - package-ecosystem: "docker"
    directories:
      - "/micro-frontend"
      - "/micro-gateway-rs"
      - "/micro-sync-rs"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker-base-images:
        patterns:
          - "*"
