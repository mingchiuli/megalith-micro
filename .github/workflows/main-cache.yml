name: Release Cache Maven Package
on:
  push:
    tags:
      - "cache-v*"

concurrency:
  group: cache-maven-central-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25i-latest'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve release version
        id: release_version
        run: python3 -m scripts.cache_release resolve-version
      - name: Verify release order
        env:
          CACHE_VERSION: ${{ steps.release_version.outputs.version }}
        run: python3 -m scripts.cache_release verify-order
      - name: Check
        env:
          CACHE_VERSION: ${{ steps.release_version.outputs.version }}
        run: python3 -m scripts.cache_release check
      - name: Publish
        env:
          CACHE_VERSION: ${{ steps.release_version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: python3 -m scripts.cache_release publish
      - name: Finalize and release
        env:
          CENTRAL_NAMESPACE: ${{ vars.SONATYPE_NAMESPACE || 'wiki.chiu' }}
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: python3 -m scripts.cache_release finalize
