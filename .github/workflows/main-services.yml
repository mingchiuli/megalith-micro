name: Build and Deploy Services

on:
  push:
    branches:
      - 'main'
    paths:
      - 'micro-auth/**'
      - 'micro-blog/**'
      - 'micro-exhibit/**'
      - 'micro-search/**'
      - 'micro-user/**'
      - 'micro-gateway-rs/**'
      - 'micro-sync-rs/**'
      - 'micro-frontend/**'
      - 'common-arch/**'
      - 'common-contract/**'
      - 'common-rpc/**'
      - 'common-web/**'
      - 'common-observability/**'
      - 'common-export/**'
      - 'common-outbox/**'
      - 'common-messaging/**'
      - 'common-scheduling/**'
      - 'common-auth-web/**'
      - 'api-auth/**'
      - 'api-user/**'
      - 'api-blog/**'
      - 'api-search/**'
      - 'cache/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/main-services.yml'
      - 'scripts/**'
      # Keep exclusions after positive patterns; module documentation is not deployable input.
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services to deploy, or all'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      java-services: ${{ steps.detect.outputs.java-services }}
      rust-services: ${{ steps.detect.outputs.rust-services }}
      deploy-services: ${{ steps.detect.outputs.deploy-services }}
      has-java: ${{ steps.detect.outputs.has-java }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-frontend: ${{ steps.detect.outputs.has-frontend }}
      has-services: ${{ steps.detect.outputs.has-services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        env:
          SERVICES_INPUT: ${{ github.event.inputs.services || 'all' }}
        run: python3 -m scripts.services

  quality-java:
    name: Java Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-java == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25i-latest'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Check all Java modules
        run: python3 -m scripts.checks java
      - name: Verify blog application startup and database integration
        run: python3 -m scripts.checks java-integration

  quality-rust:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-rust == 'true' }}
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: python3 -m scripts.checks rust-fmt
      - name: Run Clippy
        run: python3 -m scripts.checks rust-clippy
      - name: Test workspace
        run: python3 -m scripts.checks rust-test
      - name: Test Redis integration
        run: python3 -m scripts.checks rust-redis
        env:
          MICRO_SYNC_TEST_REDIS_URL: redis://127.0.0.1:6379/

  quality-frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: python3 -m scripts.checks frontend-install
      - name: Run Oxlint
        run: python3 -m scripts.checks frontend-lint
      - name: Validate formatting, types, and tests
        run: python3 -m scripts.checks frontend-quality

  build-java:
    name: Build Java Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-java
    if: ${{ needs.changes.outputs.has-java == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.java-services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25i-latest'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Info
        run: python3 -m scripts.checks java-info

      - name: Verify AOT processing
        run: python3 -m scripts.checks java-aot
        env:
          SERVICE: ${{ matrix.service }}

      - name: Build and publish image
        run: python3 -m scripts.checks java-image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_PWD }}

  build-rust:
    name: Build Rust Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-rust
    if: ${{ needs.changes.outputs.has-rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.rust-services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: mingchiuli/megalith-${{ matrix.service }}:latest

  build-frontend:
    name: Build Frontend Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-frontend
    if: ${{ needs.changes.outputs.has-frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: python3 -m scripts.checks frontend-install
      - name: Build and smoke test
        run: python3 -m scripts.checks frontend-build
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./micro-frontend/Dockerfile
          push: true
          tags: mingchiuli/megalith-frontend:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-java
      - quality-rust
      - quality-frontend
      - build-java
      - build-rust
      - build-frontend
    if: >-
      ${{
        always() &&
        needs.changes.outputs.has-services == 'true' &&
        (
          needs.changes.outputs.has-java != 'true' ||
          (needs.quality-java.result == 'success' && needs.build-java.result == 'success')
        ) &&
        (
          needs.changes.outputs.has-rust != 'true' ||
          (needs.quality-rust.result == 'success' && needs.build-rust.result == 'success')
        ) &&
        (
          needs.changes.outputs.has-frontend != 'true' ||
          (needs.quality-frontend.result == 'success' && needs.build-frontend.result == 'success')
        )
      }}
    concurrency:
      group: megalith-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare deployment script
        id: deploy-script
        env:
          DEPLOY_SERVICES: ${{ needs.changes.outputs.deploy-services }}
          SERVICE_VERSION: ${{ github.sha }}
        run: python3 -m scripts.deploy prepare

      - name: Connect to WireGuard
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: python3 -m scripts.wireguard connect

      - name: Deploy changed services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: ${{ steps.deploy-script.outputs.script }}

      - name: Disconnect WireGuard
        if: ${{ always() }}
        run: python3 -m scripts.wireguard disconnect
