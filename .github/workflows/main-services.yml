name: Build and Deploy Services

on:
  push:
    branches:
      - 'main'
    paths:
      - 'micro-auth/**'
      - 'micro-blog/**'
      - 'micro-exhibit/**'
      - 'micro-search/**'
      - 'micro-user/**'
      - 'micro-gateway-rs/**'
      - 'micro-sync-rs/**'
      - 'micro-frontend/**'
      - 'common-contract/**'
      - 'common-rpc/**'
      - 'common-web/**'
      - 'common-observability/**'
      - 'common-export/**'
      - 'common-outbox/**'
      - 'common-messaging/**'
      - 'common-scheduling/**'
      - 'common-auth-web/**'
      - 'auth-api/**'
      - 'user-api/**'
      - 'blog-api/**'
      - 'search-api/**'
      - 'cache/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/main-services.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services to deploy, or all'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      java-services: ${{ steps.detect.outputs.java-services }}
      rust-services: ${{ steps.detect.outputs.rust-services }}
      deploy-services: ${{ steps.detect.outputs.deploy-services }}
      has-java: ${{ steps.detect.outputs.has-java }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-frontend: ${{ steps.detect.outputs.has-frontend }}
      has-services: ${{ steps.detect.outputs.has-services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        env:
          SERVICES_INPUT: ${{ github.event.inputs.services || 'all' }}
        run: |
          set -euo pipefail

          ORDER=(micro-user micro-auth micro-blog micro-search micro-exhibit micro-sync-rs micro-gateway-rs megalith-frontend)
          JAVA_ORDER=(micro-user micro-auth micro-blog micro-search micro-exhibit)
          RUST_ORDER=(micro-sync-rs micro-gateway-rs)
          SELECTED=()

          has_service() {
            local target="$1"
            local service
            for service in "${SELECTED[@]}"; do
              if [ "$service" = "$target" ]; then
                return 0
              fi
            done
            return 1
          }

          add_service() {
            local service="$1"
            if ! has_service "$service"; then
              SELECTED+=("$service")
            fi
          }

          add_all_java() {
            local service
            for service in "${JAVA_ORDER[@]}"; do
              add_service "$service"
            done
          }

          add_all_rust() {
            local service
            for service in "${RUST_ORDER[@]}"; do
              add_service "$service"
            done
          }

          add_all() {
            add_all_java
            add_all_rust
            add_service megalith-frontend
          }

          add_requested_service() {
            case "$1" in
              all)
                add_all
                ;;
              micro-auth|micro-blog|micro-exhibit|micro-search|micro-user|micro-gateway-rs|micro-sync-rs|megalith-frontend)
                add_service "$1"
                ;;
              '')
                ;;
              *)
                echo "::error::Unknown service '$1'"
                exit 1
                ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for service in ${SERVICES_INPUT:-all}; do
              add_requested_service "$service"
            done
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES="$(git ls-tree -r --name-only "$AFTER")"
            else
              CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
            fi

            while IFS= read -r file; do
              case "$file" in
                micro-auth/*)
                  add_service micro-auth
                  ;;
                micro-blog/*)
                  add_service micro-blog
                  ;;
                micro-exhibit/*)
                  add_service micro-exhibit
                  ;;
                micro-search/*)
                  add_service micro-search
                  ;;
                micro-user/*)
                  add_service micro-user
                  ;;
                micro-gateway-rs/*)
                  add_service micro-gateway-rs
                  ;;
                micro-sync-rs/*)
                  add_service micro-sync-rs
                  ;;
                micro-frontend/*)
                  add_service megalith-frontend
                  ;;
                auth-api/*|user-api/*|blog-api/*|search-api/*|common-contract/*|common-rpc/*|common-web/*|common-auth-web/*|common-observability/*|common-export/*|common-outbox/*|common-messaging/*|common-scheduling/*|cache/*|build.gradle.kts|settings.gradle.kts|gradle/*|gradlew|gradlew.bat|gradle.properties)
                  add_all_java
                  ;;
                Cargo.toml|Cargo.lock)
                  add_all_rust
                  ;;
                package.json|bun.lock)
                  add_service megalith-frontend
                  ;;
                .dockerignore)
                  add_all_rust
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          ordered_selected=()
          java_services=()
          rust_services=()
          service=""

          for service in "${ORDER[@]}"; do
            if has_service "$service"; then
              ordered_selected+=("$service")
            fi
          done

          for service in "${JAVA_ORDER[@]}"; do
            if has_service "$service"; then
              java_services+=("$service")
            fi
          done

          for service in "${RUST_ORDER[@]}"; do
            if has_service "$service"; then
              rust_services+=("$service")
            fi
          done

          json_array() {
            local first=1
            local item
            printf '['
            for item in "$@"; do
              if [ "$first" -eq 1 ]; then
                first=0
              else
                printf ','
              fi
              printf '"%s"' "$item"
            done
            printf ']'
          }

          java_json="$(json_array "${java_services[@]}")"
          rust_json="$(json_array "${rust_services[@]}")"
          deploy_services="${ordered_selected[*]}"

          {
            echo "java-services=$java_json"
            echo "rust-services=$rust_json"
            echo "deploy-services=$deploy_services"
            if [ "${#java_services[@]}" -gt 0 ]; then
              echo "has-java=true"
            else
              echo "has-java=false"
            fi
            if [ "${#rust_services[@]}" -gt 0 ]; then
              echo "has-rust=true"
            else
              echo "has-rust=false"
            fi
            if has_service megalith-frontend; then
              echo "has-frontend=true"
            else
              echo "has-frontend=false"
            fi
            if [ "${#ordered_selected[@]}" -gt 0 ]; then
              echo "has-services=true"
            else
              echo "has-services=false"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Selected services: ${deploy_services:-none}"

  quality-java:
    name: Java Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-java == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Check all Java modules
        run: ./gradlew check

  quality-rust:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  quality-frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.has-frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate source and tests
        run: bun run frontend:quality

  build-java:
    name: Build Java Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-java
    if: ${{ needs.changes.outputs.has-java == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.java-services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Info
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Verify AOT processing
        run: ./gradlew :${{ matrix.service }}:processAot

      - name: Build and publish image
        run: ./gradlew :${{ matrix.service }}:bootBuildImage
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_PWD }}

  build-rust:
    name: Build Rust Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-rust
    if: ${{ needs.changes.outputs.has-rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.rust-services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: mingchiuli/megalith-${{ matrix.service }}:latest

  build-frontend:
    name: Build Frontend Service
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-frontend
    if: ${{ needs.changes.outputs.has-frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and smoke test
        run: |
          bun run frontend:build
          bun run frontend:test:ssr
          bun run frontend:test:otel
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./micro-frontend/Dockerfile
          push: true
          tags: mingchiuli/megalith-frontend:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality-java
      - quality-rust
      - quality-frontend
      - build-java
      - build-rust
      - build-frontend
    if: >-
      ${{
        always() &&
        needs.changes.outputs.has-services == 'true' &&
        (
          needs.changes.outputs.has-java != 'true' ||
          (needs.quality-java.result == 'success' && needs.build-java.result == 'success')
        ) &&
        (
          needs.changes.outputs.has-rust != 'true' ||
          (needs.quality-rust.result == 'success' && needs.build-rust.result == 'success')
        ) &&
        (
          needs.changes.outputs.has-frontend != 'true' ||
          (needs.quality-frontend.result == 'success' && needs.build-frontend.result == 'success')
        )
      }}
    concurrency:
      group: megalith-production-deploy
      cancel-in-progress: false
    steps:
      - name: Connect to WireGuard
        shell: bash
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes wireguard-tools
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Deploy changed services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            services="${{ needs.changes.outputs.deploy-services }}"
            service_version="${{ github.sha }}"

            compose() {
              service="$1"
              base_file="$2"
              override_file="$3"
              shift 3
              docker compose -f "$base_file" -f "$override_file" "$@"
            }

            compose_file() {
              service="$1"
              if [ "$service" = "micro-gateway-rs" ]; then
                printf '%s\n' docker-compose.infrastructure.yml
                return
              fi

              for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
                if [ -f "$candidate" ]; then
                  printf '%s\n' "$candidate"
                  return
                fi
              done
              echo "No Compose file found" >&2
              return 1
            }

            deploy_service() {
              service="$1"
              if [ "$service" = "megalith-frontend" ]; then
                image="mingchiuli/megalith-frontend:latest"
              else
                image="mingchiuli/megalith-${service}:latest"
              fi
              base_file=$(compose_file "$service")
              override_file=$(mktemp)
              trap 'rm -f "$override_file"' EXIT
              if [ "$service" = "megalith-frontend" ]; then
                printf 'services:\n  %s:\n    image: %s\n    environment:\n      SSR_API_BASE_URL: http://micro-gateway-rs:8088\n      OTEL_SERVICE_VERSION: %s\n      OTEL_EXPORTER_OTLP_ENDPOINT: http://apm-server:8200\n      OTEL_TRACES_SAMPLER: parentbased_traceidratio\n      OTEL_TRACES_SAMPLER_ARG: "0.5"\n' \
                  "$service" "$image" "$service_version" > "$override_file"
              else
                printf 'services:\n  %s:\n    image: %s\n' "$service" "$image" > "$override_file"
              fi

              echo "Deploying ${service}"
              previous_image_id=$(docker image inspect "$image" --format '{{.Id}}' 2>/dev/null || true)
              docker pull "$image"
              compose "$service" "$base_file" "$override_file" rm -sf "$service"
              compose "$service" "$base_file" "$override_file" up -d --no-deps --force-recreate "$service"

              container_id=$(compose "$service" "$base_file" "$override_file" ps -q "$service")
              if [ -z "$container_id" ]; then
                compose "$service" "$base_file" "$override_file" ps "$service"
                exit 1
              fi

              for attempt in $(seq 1 60); do
                health_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
                if [ "$health_status" = "healthy" ]; then
                  break
                fi
                if [ "$health_status" = "unhealthy" ] || [ "$attempt" -eq 60 ]; then
                  compose "$service" "$base_file" "$override_file" ps "$service"
                  docker logs --tail=200 "$container_id"
                  exit 1
                fi
                sleep 2
              done

              current_image_id=$(docker image inspect "$image" --format '{{.Id}}')
              if [ -n "$previous_image_id" ] && [ "$previous_image_id" != "$current_image_id" ]; then
                docker image rm "$previous_image_id" || true
              fi

              rm -f "$override_file"
              trap - EXIT

              if [ "$service" = "micro-gateway-rs" ]; then
                nginx=$(docker ps | grep -w 'nginx' | awk '{print $1}' || true)
                if [ -n "$nginx" ]; then
                  docker exec "$nginx" nginx -s reload
                fi
              fi
            }

            for service in $services; do
              deploy_service "$service"
            done

      - name: Disconnect WireGuard
        if: ${{ always() }}
        run: |
          sudo wg-quick down wg0 || true
          sudo rm -f /etc/wireguard/wg0.conf
