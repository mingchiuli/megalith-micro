spring:
  application:
    name: micro-auth
  mail:
    host: smtp.163.com
    port: 465
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
  profiles:
    default: dev
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
    time-zone: GMT+8
server:
  port: 8081
  max-http-request-header-size: 10MB

megalith:
  cache:
    eviction:
      transport: RABBIT
      rabbit:
        queue-prefix: cache.user.evict.queue.
        exchange: cache.user.evict.fanout.exchange
  auth:
    code:
      max-attempts: 3
    password-failures:
      max-attempts: 3
      window: 15m
    jwt:
      access-token-expire: 900
      refresh-token-expire: 604800
      websocket-token-expire: 300
      issuer: micro-auth
      audience: megalith-api
    cookie:
      path: /
      secure: ${MEGALITH_AUTH_COOKIE_SECURE:true}
      same-site: Strict
  blog:
    sms:
      base-url: https://dysmsapi.aliyuncs.com
