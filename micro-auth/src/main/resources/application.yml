spring:
  application:
    name: micro-auth
  mail:
    host: smtp.163.com
    port: 465
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
  profiles:
    default: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
    time-zone: GMT+8
server:
  port: 8081
  max-http-request-header-size: 10MB

megalith:
  cache:
    queue-prefix: cache.user.evict.queue.
    fanout-exchange: cache.user.evict.fanout.exchange
  auth:
    jwt:
      access-token-expire: 900
      refresh-token-expire: 604800
      websocket-token-expire: 300
      issuer: micro-auth
      audience: megalith-api
    refresh-cookie:
      path: /api/token/refresh
  blog:
    email-try-count: 3
    password-error-intervalTime: 900000
    sms:
      base-url: https://dysmsapi.aliyuncs.com
