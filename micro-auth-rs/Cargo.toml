[package]
name = "micro-auth-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
megalith-service-runtime.workspace = true
cache-rs.workspace = true
megalith-api = { workspace = true, features = ["client"] }
megalith-otel.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["json", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
redis.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
bcrypt = "0.19.3"
rand = "0.10"
hmac = "0.12"
sha1 = "0.10"
chrono = "0.4"
httpdate = "1"
url.workspace = true
mime = "0.3"
sha2 = "0.10"
async-trait = "0.1.89"
