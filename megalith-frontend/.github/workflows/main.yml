name: Build and Deploy SSR Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run test:unit -- --run
          npm run build
          npm run test:ssr

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push SSR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: mingchiuli/megalith-frontend:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: main
    concurrency:
      group: megalith-frontend-production-deploy
      cancel-in-progress: false
    steps:
      - name: Connect to WireGuard
        shell: bash
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes wireguard-tools
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Deploy latest image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            image="mingchiuli/megalith-frontend:latest"
            service="megalith-frontend"
            previous_image=$(docker image inspect "$image" --format '{{.Id}}' 2>/dev/null || true)

            wait_until_healthy() {
              container_id=$(docker compose ps -q "$service")
              if [ -z "$container_id" ]; then
                return 1
              fi

              for attempt in $(seq 1 60); do
                health_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
                if [ "$health_status" = "healthy" ]; then
                  return 0
                fi
                if [ "$health_status" = "unhealthy" ]; then
                  return 1
                fi
                sleep 2
              done
              return 1
            }

            docker pull "$image"
            docker compose rm -sf "$service"
            docker compose up -d --no-deps --force-recreate "$service"

            if ! wait_until_healthy; then
              container_id=$(docker compose ps -q "$service")
              if [ -n "$container_id" ]; then
                docker logs --tail=200 "$container_id" || true
              fi

              if [ -n "$previous_image" ]; then
                echo "Deployment failed; restoring previous local image"
                docker tag "$previous_image" "$image"
                docker compose rm -sf "$service"
                docker compose up -d --no-deps --force-recreate "$service"
                wait_until_healthy || true
              fi
              exit 1
            fi

      - name: Disconnect WireGuard
        if: ${{ always() }}
        run: |
          sudo wg-quick down wg0 || true
          sudo rm -f /etc/wireguard/wg0.conf
